<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
	<link rel="icon" type="image/png" href="/iconfordiscord.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Phones / tablets: always lay the page out at the desktop size (>= 900px wide, >= ~720px tall) and let the
      // browser shrink that whole page to fit the screen. The window then keeps the exact PC layout and 4:3 shape
      // on every device instead of re-flowing into a stretched mobile layout.
      (function () {
        try {
          var meta = document.querySelector('meta[name="viewport"]');
          if (!meta || !window.matchMedia('(pointer: coarse)').matches) return;
          var apply = function () {
            var s = Math.min(screen.width, screen.height), l = Math.max(screen.width, screen.height);
            if (s >= 900) { meta.setAttribute('content', 'width=device-width, initial-scale=1'); return; }
            var landscape = window.matchMedia('(orientation: landscape)').matches;
            var ratio = landscape ? l / s : s / l; // screen width / screen height
            meta.setAttribute('content', 'width=' + Math.max(900, Math.ceil(720 * ratio)));
          };
          apply();
          window.addEventListener('orientationchange', apply);
          var mq = window.matchMedia('(orientation: landscape)');
          if (mq.addEventListener) mq.addEventListener('change', apply);
        } catch (e) { /* keep the default viewport */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <meta property="og:image" content="https://novoumy.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Dark / inverted palettes were removed. Returning visitors may still have one cached, so wipe the
      // old keys and any theme markers before first paint; they fall back to the default light theme.
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove('theme-dark', 'theme-soft', 'dark');
          root.removeAttribute('data-theme');
          root.style.removeProperty('color-scheme');
          ['novoumy-theme', 'theme', 'visual-mode', 'novoumy:theme', 'novoumy-visual-mode'].forEach(function (key) {
            localStorage.removeItem(key);
          });
        } catch (_) {
          // Storage may be unavailable; there is nothing cached to clear.
        }
      })();
    </script>
    <title>novoumy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
