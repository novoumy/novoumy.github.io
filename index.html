<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1C1040" />

    <meta property="og:image" content="https://novoumy.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Lavender from the very first paint (and behind the browser bars / overscroll), so a white page never flashes. */
      html, body { background-color: #241645; color-scheme: dark; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the page paints straight away with the fallback monospace and swaps the pixel fonts in. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" /></noscript>
    <link rel="preload" as="image" href="/icon.png" type="image/png" />
    <script>
      // Dark / inverted palettes were removed. Returning visitors may still have one cached, so wipe the
      // old keys and any theme markers before first paint; they fall back to the default light theme.
      (function () {
        try {
          var root = document.documentElement;
          // Lite mode: phones / tablets / low-core devices get a cheaper look (no backdrop blur, fewer animated
          // layers). Force either way for testing with ?perf=lite or ?perf=full.
          var forced = /[?&]perf=(lite|full)/.exec(location.search);
          var lite = forced
            ? forced[1] === 'lite'
            : matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
          if (lite) root.dataset.perf = 'lite';
          root.classList.remove('theme-dark', 'theme-soft', 'dark');
          root.removeAttribute('data-theme');
          root.style.removeProperty('color-scheme');
          ['novoumy-theme', 'theme', 'visual-mode', 'novoumy:theme', 'novoumy-visual-mode'].forEach(function (key) {
            localStorage.removeItem(key);
          });
        } catch (_) {
          // Storage may be unavailable; there is nothing cached to clear.
        }
      })();
    </script>
    <title>novoumy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
