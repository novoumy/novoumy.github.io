<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://api.counterapi.dev" crossorigin />
    <meta charset="UTF-8" />
	<link rel="icon" type="image/png" href="/iconfordiscord.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <meta property="og:image" content="https://novoumy.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Dark / inverted palettes were removed. Returning visitors may still have one cached, so wipe the
      // old keys and any theme markers before first paint; they fall back to the default light theme.
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove('theme-dark', 'theme-soft', 'dark');
          root.removeAttribute('data-theme');
          root.style.removeProperty('color-scheme');
          ['novoumy-theme', 'theme', 'visual-mode', 'novoumy:theme', 'novoumy-visual-mode'].forEach(function (key) {
            localStorage.removeItem(key);
          });
        } catch (_) {
          // Storage may be unavailable; there is nothing cached to clear.
        }
      })();
    </script>
    <title>novoumy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
