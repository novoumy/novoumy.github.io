<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#847FA4" />
    <title>404 Not Found — novoumy</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --paper: #ECEFF1;
        --lavender: #847FA4;
        --wine: #6B2D39;
        --rose: #CD9EBA;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 18px;
        color: var(--wine);
        background-color: var(--lavender);
        background-image:
          linear-gradient(to right, rgba(236,239,241,.12) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(236,239,241,.12) 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: 'VT323', monospace;
      }
      .menu-frame {
        width: min(100%, 560px);
        padding: 7px;
        background: var(--paper);
        border: 4px solid var(--wine);
        box-shadow: 6px 6px 0 var(--wine);
      }
      .menu-lines {
        display: flex;
        min-height: 230px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        padding: 38px 18px;
        border-top: 2px solid var(--rose);
        border-bottom: 2px solid var(--rose);
        text-align: center;
      }
      h1 {
        margin: 0;
        font: clamp(14px, 4.5vw, 19px)/1.7 'Press Start 2P', monospace;
        color: var(--wine);
      }
      button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border: 2px solid var(--wine);
        background: var(--wine);
        box-shadow: 4px 4px 0 var(--wine);
        color: var(--paper);
        font: 9px/1.5 'Press Start 2P', monospace;
        cursor: pointer;
        transition: transform 100ms steps(2), box-shadow 100ms steps(2), background 100ms steps(2), color 100ms steps(2);
      }
      button:hover, button:focus-visible {
        outline: 2px dashed var(--wine);
        outline-offset: 4px;
        background: var(--rose);
        color: var(--wine);
      }
      button:active { transform: translate(4px, 4px); box-shadow: none; }
      @media (max-width: 420px) {
        .menu-lines { min-height: 205px; gap: 28px; }
      }
    </style>
  </head>
  <body>
    <main class="menu-frame">
      <section class="menu-lines" aria-labelledby="error-title">
        <h1 id="error-title">404 Not Found</h1>
        <button type="button" id="go-back">Go Back</button>
      </section>
    </main>
    <script>
      document.getElementById('go-back').addEventListener('click', function () {
        if (window.history.length > 1) window.history.back();
        else window.location.assign('/#main');
      });
    </script>
  </body>
</html>
