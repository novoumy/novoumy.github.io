        var BIO = 'I like spending way too much time on my pc.. soo I made this website to share my favorite media, games, songs and quotes. ^.^';
        function pad(n, len) { var s = String(n); while (s.length < len) s = '0' + s; return s; }
        function clockText() {
          try {

        // Bubble border: identical code to src/lib/bubbleBorder.ts. Every bubble's size is a function of Date.now(),
        // so the real page picks up the exact same frame and the morph never snaps or restarts.
        var PX = 4, WRAP = 256, TAU = Math.PI * 2;
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        var bubbleSets = {};
        function makeBubbles(H, seed) {
          var key = H + ':' + seed;
          if (bubbleSets[key]) return bubbleSets[key];
          var rnd = mulberry32(seed * 7919 + H), R = function (a, b) { return a + rnd() * (b - a); };
          var k = Math.max(H / 22, 0.78), list = [];
          // Timing is exactly as before: each bubble has its own tick rate, offset, breathing period and pop cycle.
          function make(cx, cy, rx, ry, pop, amp) {
            var b = {
              kind: 0, cx: cx, cy: cy, rx: rx, ry: ry,
              tick: R(160, 950), off: R(0, 20000),
              period: R(2200, 9000), phase: R(0, TAU), amp: amp,
              pop: pop, span: R(5000, 15000), dead: R(0.12, 0.3)
            };
            list.push(b); return b;
          }
          var limit = H - 2.2;                       // nothing ever reaches the empty bottom row, even at full breathing size
          var fits = function (cy, ry, amp) { return cy + ry * (1 + amp) <= limit; };
          var i, j, p, a, rr, amp, hills = [], lumps = [], beads = [];
          // 1) rolling hills: big half-domes rooted on the bar line (centres sit inside the solid top band, so only the
          //    lower half shows, like a semicircle growing out of the bar). Heavily overlapped; radii vary for rhythm.
          var x = R(0, 3), r = R(6, 10) * k, nr;
          while (x < WRAP + 6) {
            amp = R(0.07, 0.13);
            var cy = R(2, 3.6);
            while (!fits(cy, r, amp) && r > 3) r *= 0.9;
            hills.push(make(x, cy, r * R(1, 1.08), r, false, amp));
            nr = R(6, 10) * k;
            x += (r + nr) * R(0.9, 1.05);
            r = nr;
          }
          // 2) puffy lumps centred just inside each hill's rim, so they stay fused to it and give a cumulus outline
          for (i = 0; i < hills.length; i++) {
            p = hills[i];
            var n = rnd() < 0.8 ? 3 : 2;
            for (j = 0; j < n; j++) {
              a = R(Math.PI * 0.1, Math.PI * 0.9); rr = p.ry * R(0.36, 0.58); amp = R(0.1, 0.2);
              var lx = p.cx + Math.cos(a) * p.rx * 0.93, ly = p.cy + Math.sin(a) * p.ry * 0.93;
              if (!fits(ly, rr, amp)) continue;
              lumps.push(make(lx, ly, rr, rr, rnd() < 0.4, amp));
            }
          }
          // 3) small round beads on some lumps, also rooted in their parent
          for (i = 0; i < lumps.length; i++) {
            if (rnd() > 0.45) continue;
            p = lumps[i]; a = R(Math.PI * 0.2, Math.PI * 0.8); rr = p.ry * R(0.42, 0.58); amp = R(0.12, 0.24);
            if (rr < 1.4 * k) continue;
            var bx = p.cx + Math.cos(a) * p.rx * 0.88, by = p.cy + Math.sin(a) * p.ry * 0.88;
            if (!fits(by, rr, amp)) continue;
            p.pop = false;   // a puff that carries a bead never pops, so the bead can't be left floating
    beads.push(make(bx, by, rr, rr, rnd() < 0.55, amp));
          }

          return list;
        }

        function scaleAt(b, now) {
          var t = Math.floor((now + b.off) / b.tick) * b.tick;
          var s = 1 + b.amp * Math.sin(TAU * t / b.period + b.phase);
          if (b.pop) {
            var u = (t % b.span) / b.span, e;
            if (u < 0.14) e = u / 0.14; else if (u < 1 - b.dead - 0.1) e = 1; else if (u < 1 - b.dead) e = (1 - b.dead - u) / 0.1; else e = 0;

        }
        function fillGrid(grid, cols, H, seed, now) {
          var list = makeBubbles(H, seed), tiles = Math.ceil(cols / WRAP), L, k, b, s, rx, ry, sh, y, x, x0, x1, y0, y1, px, py, idx, e;
          grid.fill(0);
          for (L = 0; L < 2; L++) {
            for (k = 0; k < list.length; k++) {
              b = list[k]; if (b.kind !== L) continue;
              s = scaleAt(b, now); if (s < 0.3) continue;
              rx = b.rx * s; ry = b.ry * s;
              if (rx < 0.8 || ry < 0.8) continue;
              y0 = Math.max(0, Math.floor(b.cy - ry)); y1 = Math.min(H - 1, Math.ceil(b.cy + ry));
              for (sh = -1; sh <= tiles; sh++) {
                var cx = b.cx + sh * WRAP;

                  }

          for (y = 0; y < top; y++) for (x = 0; x < cols; x++) grid[y * cols + x] = 1;   // buries the bar's straight edge
          for (x = 0; x < cols; x++) grid[(H - 1) * cols + x] = 0;                        // never a flat cutoff on the cream side
        }

        var registry = [], running = false, lastDraw = 0, tickCount = 0;
        function drawOne(item, now) {
          var c = item.canvas, parent = c.parentElement; if (!parent) return;
          var cols = Math.max(1, Math.ceil(parent.clientWidth / PX)), H = Math.max(6, Math.round(parent.clientHeight / PX));
          if (!cols || !parent.clientHeight) return;
          if (c.width !== cols || c.height !== H) { c.width = cols; c.height = H; c.style.width = cols * PX + 'px'; c.style.height = H * PX + 'px'; item.grid = new Uint8Array(cols * H); }
          if (!item.ctx) item.ctx = c.getContext('2d');
          var ctx = item.ctx;
          if (!item.color || tickCount % 40 === 0) { try { var cs = getComputedStyle(c); item.color = cs.color; item.rim = cs.borderTopColor || item.color; } catch (e) { item.color = '#dfb5b5'; item.rim = '#c89698'; } }
          fillGrid(item.grid, cols, H, item.seed, now);
          ctx.clearRect(0, 0, cols, H);
          ctx.fillStyle = item.color;
          for (var y = 0; y < H; y++) {
            var x = 0;
            while (x < cols) {
              if (item.grid[y * cols + x]) { var x0 = x; while (x < cols && item.grid[y * cols + x]) x++; ctx.fillRect(x0, y, x - x0, 1); } else x++;
            }

          ctx.fillStyle = item.rim;

            var rx = 0;
            while (rx < cols) {
              if (item.grid[ry * cols + rx] && (ry === H - 1 || !item.grid[(ry + 1) * cols + rx])) { var r0 = rx; while (rx < cols && item.grid[ry * cols + rx] && (ry === H - 1 || !item.grid[(ry + 1) * cols + rx])) rx++; ctx.fillRect(r0, ry, rx - r0, 1); } else rx++;
            }

        function loop(ts) {
          registry = registry.filter(function (it) { return it.canvas.isConnected; });
          if (!registry.length) { running = false; return; }
          if (ts - lastDraw >= 33) {

        // Every bubble's size is a pure function of the wall clock (Date.now), so the real page and the 404 morph page
        // show exactly the same bubbles at the same moment: no restart, snap or jump when one hands over to the other.
        function mountBubbleBorder(canvas, position) {
          var item = { canvas: canvas, seed: position === 'bottom' ? 2 : 1, ctx: null, grid: null, color: '', rim: '' };

        }


        function buildReplica(t) {
          var el = document.createElement('div');

        async function scrambleTo(finalCode, finalLabel) {
          var digits = codeEl.children;
          var locked = [false, false, false];
          var lockAt = [380, 640, 900];
          var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*';
          var t0 = performance.now(), tick = 0;
          while (true) {
            var el = performance.now() - t0;
            for (var i = 0; i < 3; i++) {
              if (!locked[i] && el >= lockAt[i]) { locked[i] = true; digits[i].textContent = finalCode[i]; sfx.lock(i); }
              else if (!locked[i]) digits[i].textContent = String(Math.floor(Math.random() * 10));
            }
            // label scrambles, settling left-to-right
            var settle = Math.floor((el / 1000) * finalLabel.length * 1.2);
            var out = '';
            for (var k = 0; k < finalLabel.length; k++) out += k < settle ? finalLabel[k] : (finalLabel[k] === ' ' ? ' ' : pick(chars));
            labelEl.textContent = out;
            if (!(tick++ % 2)) sfx.roll(tick);
            if (locked[0] && locked[1] && locked[2] && settle >= finalLabel.length) break;
            await sleep(55);
          }
          labelEl.textContent = finalLabel;
        }

        async function typeInto(el, text, perChar) {
          for (var i = 1; i <= text.length; i++) {
            el.textContent = text.slice(0, i);
            if (i % 3 === 0) sfx.key();
            await sleep(perChar);
          }
        }

        async function run(href) {
          started = true;
          go.setAttribute('aria-disabled', 'true');
          go.textContent = 'REBOOTING...';
          sfx.press();
          document.documentElement.style.overflow = 'hidden';

          // 1) 404 -> 200
          await scrambleTo(['2', '0', '0'], 'FOUND');
          await sleep(180);

          // 2) power surge
          sfx.surge();
          var surgeAnim = surge.animate([{ opacity: 0 }, { opacity: 0.55, offset: 0.25 }, { opacity: 0 }], { duration: 260, easing: 'steps(4)' });
          wipe.style.top = '0px';
          var wipeAnim = wipe.animate(
            [{ transform: 'translateY(-14vh)', opacity: 0.9 }, { transform: 'translateY(105vh)', opacity: 0.9 }],
            { duration: 700, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
          screen.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(7px)' }, { transform: 'translateX(0)' }], { duration: 220, easing: 'steps(4)' });
          await done(surgeAnim);

          // 3) the error window becomes the main window
          var t = target();
          var r = win.getBoundingClientRect();
          win.style.position = 'fixed';
          win.style.left = r.left + 'px'; win.style.top = r.top + 'px';
          win.style.width = r.width + 'px'; win.style.height = r.height + 'px';
          win.style.margin = '0'; win.style.maxHeight = 'none'; win.style.zIndex = '5';
          win.style.overflow = 'hidden';

          var replica = buildReplica(t);
          win.appendChild(replica);
          replica.querySelectorAll('.pixel-divider').forEach(function (d) {
            mountBubbleBorder(d.querySelector('canvas'), d.classList.contains('pixel-divider-bottom') ? 'bottom' : 'top');
          });
          var tabs = buildTabs(t);
          document.body.appendChild(tabs);

          var s = t.zoom;
          var startW = r.width - 8; // content box of the window (inside its 4px border)
          var k0 = Math.max(0.35, Math.min(1, startW / t.w));
          var frame = cssVar('--frame-shadow') || '#6B2D39';
          var EASE = 'cubic-bezier(.76,0,.24,1)', DUR = 820;
          sfx.morph();

          var winAnim = win.animate([
            { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', padding: '8px', borderWidth: '4px', boxShadow: '7px 7px 0 ' + frame },
            { left: (t.left - 4 * s) + 'px', top: (t.top - 4 * s) + 'px', width: (t.w + 8 * s) + 'px', height: (t.h + 8 * s) + 'px', padding: '0px', borderWidth: (4 * s) + 'px', boxShadow: (4 * s) + 'px ' + (4 * s) + 'px 0 ' + frame }
          ], { duration: DUR, easing: EASE, fill: 'forwards' });
          var screenAnim = screen.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
          var repShow = replica.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 380, delay: DUR * 0.35, easing: 'ease-out', fill: 'forwards' });
          var repScale = replica.animate([{ transform: 'scale(' + k0 + ')' }, { transform: 'scale(1)' }], { duration: DUR, easing: EASE, fill: 'forwards' });
          screen.style.position = 'absolute'; screen.style.inset = '8px'; // leave flow so it can't push the window's size
          screen.style.minHeight = '0';
          await Promise.all([done(winAnim), done(screenAnim), done(repShow), done(repScale), done(wipeAnim)]);

          // commit the final state, drop the animation fills
          win.style.left = (t.left - 4 * s) + 'px'; win.style.top = (t.top - 4 * s) + 'px';
          win.style.width = (t.w + 8 * s) + 'px'; win.style.height = (t.h + 8 * s) + 'px';
          win.style.padding = '0'; win.style.borderWidth = (4 * s) + 'px'; win.style.boxShadow = (4 * s) + 'px ' + (4 * s) + 'px 0 ' + frame;

          wipe.style.display = 'none';

          // 4) tabs drop in, one blip each
          tabs.style.opacity = '1';
          var items = tabs.querySelectorAll('.tab');
          var anims = [];
          for (var i = 0; i < items.length; i++) {
            (function (el, idx) {
              var rest = el.classList.contains('active') ? 'translateY(4px)' : 'none';
              setTimeout(function () { sfx.tab(Math.min(idx, 4)); }, idx * 85);
              anims.push(done(el.animate(
                [{ opacity: 0, transform: 'translateY(-28px)' }, { opacity: 1, transform: rest }],
                { duration: 300, delay: idx * 85, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' })));
            })(items[i], i);
          }
          await Promise.all(anims);

          // 5) the profile pops in (live clock keeps ticking), then hand over to the real page
          sfx.boot();
          var clockEl = replica.querySelector('.r-clock');
          var clockTimer = setInterval(function () { clockEl.textContent = 'GMT+3 \u2022 ' + clockText(); }, 1000);
          var parts = replica.querySelectorAll('.r-center > *');
          var pops = [];
          for (var j = 0; j < parts.length; j++) {
            pops.push(done(parts[j].animate(
              [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }],
              { duration: 320, delay: j * 90, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' })));
          }
          await Promise.all(pops);
          await sleep(450);
          clearInterval(clockTimer);
          // tell the app this window is already on screen so it doesn't fade it in a second time
          try { sessionStorage.setItem('novoumy:from404', '1'); } catch (_) {}

          window.location.assign(href);
        }

        go.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return; // let "open in new tab" work
          if (started) { e.preventDefault(); return; }
          if (reduce) return;
          e.preventDefault();
          run('/#main').catch(function () { window.location.assign('/#main'); });
        });
      })();
