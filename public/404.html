<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#847FA4" />
    <title>404 Not Found — novoumy</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --paper: #ECEFF1;
        --lavender: #847FA4;
        --wine: #6B2D39;
        --rose: #CD9EBA;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: var(--wine);
        background-color: var(--lavender);
        background-image:
          linear-gradient(to right, rgba(236,239,241,.12) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(236,239,241,.12) 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: 'VT323', monospace;
      }
      .error-window {
        position: relative;
        width: min(100%, 680px);
        padding: 8px;
        background: var(--paper);
        border: 4px solid var(--wine);
        box-shadow: 7px 7px 0 var(--wine);
      }
      .error-screen {
        position: relative;
        display: flex;
        min-height: 340px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        overflow: hidden;
        padding: 48px 18px;
        border-top: 3px solid var(--rose);
        border-bottom: 3px solid var(--rose);
        text-align: center;
        isolation: isolate;
      }
      .error-screen::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background: repeating-linear-gradient(to bottom, rgba(107,45,57,.035) 0 1px, transparent 1px 4px);
        content: '';
      }
      h1 {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: 0;
        color: var(--wine);
      }
      .error-code {
        display: block;
        font: clamp(58px, 15vw, 112px)/1 'Press Start 2P', monospace;
        letter-spacing: -0.08em;
        padding-right: .08em;
        text-shadow: 5px 5px 0 var(--rose), 10px 10px 0 rgba(107,45,57,.16);
      }
      .error-label {
        display: block;
        font: clamp(11px, 2.5vw, 16px)/1.5 'Press Start 2P', monospace;
        letter-spacing: .08em;
      }
      .go-home {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border: 3px solid var(--wine);
        background: var(--wine);
        box-shadow: 5px 5px 0 var(--rose), 8px 8px 0 var(--wine);
        color: var(--paper);
        font: 9px/1.5 'Press Start 2P', monospace;
        text-decoration: none;
        transition: transform 100ms steps(2), box-shadow 100ms steps(2), background 100ms steps(2), color 100ms steps(2);
      }
      .go-home:hover, .go-home:focus-visible {
        outline: 2px dashed var(--wine);
        outline-offset: 5px;
        background: var(--rose);
        color: var(--wine);
      }
      .go-home:active {
        transform: translate(5px, 5px);
        box-shadow: none;
      }
      @media (max-width: 420px) {
        .error-screen { min-height: 290px; gap: 30px; padding-inline: 10px; }
        .error-code { font-size: clamp(52px, 16vw, 68px); }
        .error-label { font-size: 10px; }
        .go-home { font-size: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="error-window">
      <section class="error-screen" aria-labelledby="error-title">
        <h1 id="error-title" aria-label="404 Not Found">
          <span class="error-code" aria-hidden="true">404</span>
          <span class="error-label">NOT FOUND</span>
        </h1>
        <a class="go-home" href="https://novoumy.com/">GO BACK</a>
      </section>
    </main>
  </body>
</html>
