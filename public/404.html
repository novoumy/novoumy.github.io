<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1C1040" />
    <script>
      // Dark / inverted palettes were removed: clear any cached theme so the 404 stays on the default light look.
      (function () {
        try {
          var root = document.documentElement;
          root.classList.remove('theme-dark', 'theme-soft', 'dark');
          root.removeAttribute('data-theme');
          root.style.removeProperty('color-scheme');
          ['novoumy-theme', 'theme', 'visual-mode', 'novoumy:theme', 'novoumy-visual-mode'].forEach(function (key) {
            localStorage.removeItem(key);
          });
        } catch (_) {
          // Storage may be unavailable; there is nothing cached to clear.
        }
      })();
    </script>
    <title>404 Not Found — Novoumy</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        /* Ethereal amethyst & starlight palette: same tokens as src/index.css */
        --glow: 196 170 255;
        --amethyst: 124 84 220;
        --cool-white: #F5F1FF;
        --lavender: #241645;
        --wine: #3A2272;
        --rose: #B8A2F2;
        --status-pink: #D6C9F8;
        --glass: rgb(240 234 255 / 0.40);
        --glass-blur: blur(22px) saturate(160%) brightness(1.08);
        --glow-line: 0 0 0 1.5px rgb(var(--glow) / 0.85), 0 0 14px 2px rgb(var(--glow) / 0.45), inset 0 0 18px rgb(255 255 255 / 0.35);
        --glow-pulse: 0 0 0 1.5px rgb(var(--glow) / 1), 0 0 22px 6px rgb(var(--amethyst) / 0.55), 0 0 44px 10px rgb(var(--glow) / 0.3), inset 0 0 20px rgb(255 255 255 / 0.5);
        --window-glow: 0 0 0 1px rgb(255 255 255 / 0.7), 0 0 24px 4px rgb(var(--glow) / 0.55), 0 0 90px 20px rgb(var(--amethyst) / 0.35), inset 0 0 30px rgb(255 255 255 / 0.4);
        --text-glow: 0 0 4px rgb(255 255 255 / 0.6), 0 0 14px rgb(var(--glow) / 0.6), 0 0 32px rgb(var(--glow) / 0.35);
        --tab-bg: #241645;
        --tab-fg: #F5F1FF;
        --scan: rgb(255 255 255 / 0.035);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      html, body {
        background:
          radial-gradient(ellipse 50% 40% at 15% 18%, rgb(186 140 255 / 0.45), transparent 70%),
          radial-gradient(ellipse 45% 45% at 88% 82%, rgb(230 170 255 / 0.35), transparent 70%),
          radial-gradient(ellipse 40% 30% at 70% 15%, rgb(150 200 255 / 0.18), transparent 70%),
          radial-gradient(ellipse 90% 70% at 50% 55%, rgb(90 55 180 / 0.55), transparent 85%),
          linear-gradient(165deg, #1C1040 0%, #33206A 50%, #1A0F3A 100%) fixed;
        background-color: #241645;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: var(--wine);
        font-family: 'VT323', monospace;
      }
      /* Backdrop: grid, nebulae, stardust and rising particles (same formulas as src/components/PixelBackdrop.tsx) */
      .backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
      .backdrop-grid {
        position: absolute; inset: 0; opacity: 0.07;
        background-image: linear-gradient(to right, #CBB8FF 1px, transparent 1px), linear-gradient(to bottom, #CBB8FF 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .nebula { position: absolute; border-radius: 9999px; filter: blur(60px); opacity: 0.5; animation: nebula-breathe 18s ease-in-out infinite alternate; }
      @keyframes nebula-breathe { from { transform: scale(1) translate(0,0); opacity: 0.35; } to { transform: scale(1.2) translate(30px,-20px); opacity: 0.6; } }
      .stardust { position: absolute; border-radius: 9999px; background: #FFFFFF;
        box-shadow: 0 0 8px 2px rgb(var(--glow) / 0.9), 0 0 2px rgb(255 255 255);
        animation: star-twinkle var(--tw, 4s) ease-in-out infinite, star-drift var(--dr, 60s) linear infinite; }
      @keyframes star-twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes star-drift { from { translate: 0 0; } to { translate: 40px -120px; } }
      .particle { position: absolute; bottom: -12px; opacity: 0.6; animation: float-particle linear infinite; }
      @keyframes float-particle { from { transform: translateY(0); } to { transform: translateY(-110vh); } }
      @media (prefers-reduced-motion: reduce) { .stardust, .nebula, .particle, .replica::before, .r-avatar { animation: none !important; } }

      /* Frosted-glass card with a luminous border */
      .error-window {
        position: relative;
        z-index: 1;
        width: min(100%, 680px);
        padding: 0;
        background: var(--glass);
        -webkit-backdrop-filter: var(--glass-blur);
        backdrop-filter: var(--glass-blur);
        box-shadow: var(--window-glow);
        isolation: isolate;
      }
      .error-window::before {
        content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background:
          radial-gradient(120% 60% at 50% -10%, rgb(255 255 255 / 0.45), transparent 60%),
          radial-gradient(80% 50% at 50% 110%, rgb(200 170 255 / 0.35), transparent 70%);
        mix-blend-mode: screen;
      }
      .error-screen {
        position: relative;
        display: flex;
        min-height: 340px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        overflow: hidden;
        padding: 56px 18px;
        text-align: center;
        isolation: isolate;
      }
      .error-screen::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background: repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 4px);
        content: '';
      }
      /* glowing hairlines top and bottom (replaces the old rose rules) */
      .error-screen::after {
        position: absolute; z-index: -1; inset: 12px 12px;
        border-top: 2px solid rgb(var(--glow) / 0.75);
        border-bottom: 2px solid rgb(var(--glow) / 0.75);
        box-shadow: 0 -6px 14px -8px rgb(var(--glow) / 0.8), 0 6px 14px -8px rgb(var(--glow) / 0.8);
        content: '';
      }
      h1 {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: 0;
        color: var(--wine);
      }
      .error-code {
        display: flex;
        font: clamp(58px, 15vw, 112px)/1 'Press Start 2P', monospace;
        letter-spacing: -0.08em;
        padding-right: .08em;
        text-shadow: var(--text-glow);
      }
      .error-code.glitch { animation: glitch .24s steps(2) 1; }
      @keyframes glitch {
        0%   { transform: translate(0, 0); text-shadow: var(--text-glow); }
        25%  { transform: translate(-6px, 2px); text-shadow: 10px 0 0 rgb(var(--glow) / 0.85), -8px 0 0 rgb(150 200 255 / 0.7); }
        50%  { transform: translate(5px, -2px); text-shadow: -9px 3px 0 rgb(var(--glow) / 0.85), 8px -3px 0 rgb(150 200 255 / 0.7); }
        75%  { transform: translate(-3px, 0); text-shadow: 6px 5px 0 rgb(var(--glow) / 0.7), var(--text-glow); }
        100% { transform: translate(0, 0); }
      }
      .error-label {
        display: block;
        min-height: 1.5em;
        font: clamp(11px, 2.5vw, 16px)/1.5 'Press Start 2P', monospace;
        letter-spacing: .08em;
        text-shadow: var(--text-glow);
      }
      /* same look as the site's .pixel-btn */
      @keyframes amethyst-pulse { 0%, 100% { box-shadow: var(--glow-line); } 50% { box-shadow: var(--glow-pulse); } }
      .go-home {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border: 0;
        background: linear-gradient(135deg, #4A2C8F, #6F4BC9);
        box-shadow: var(--glow-line);
        text-shadow: 0 0 6px rgb(var(--glow) / 0.9);
        color: var(--cool-white);
        font: 9px/1.5 'Press Start 2P', monospace;
        text-decoration: none;
        transition: box-shadow 400ms ease, background 400ms ease, transform 400ms ease, color 300ms ease;
      }
      .go-home:hover, .go-home:focus-visible {
        outline: none;
        transform: translateY(-2px);
        background: linear-gradient(135deg, #6F4BC9, #9B7BEA);
        color: #F5F1FF;
        animation: amethyst-pulse 2.2s ease-in-out infinite;
      }
      .go-home:active { transform: translateY(0); }
      .go-home[aria-disabled='true'] { pointer-events: none; }

      /* ---------- morph layers (hidden until GO BACK is pressed) ---------- */
      .replica {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        isolation: isolate;
        color: var(--wine);
        font-family: 'VT323', monospace;
        font-size: 22px;
        line-height: 1.35;
        opacity: 0;
        transform-origin: 0 0;
        pointer-events: none;
      }
      /* Mirror of the Main tab (see src/views/main.css) so the morph lands on exactly what the site draws. */
      .replica { justify-content: space-between; }
      /* soft halo of light, as on the real window (index.css .main-playground::before) */
      .replica::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
        background:
          radial-gradient(120% 60% at 50% -10%, rgb(255 255 255 / 0.45), transparent 60%),
          radial-gradient(80% 50% at 50% 110%, rgb(200 170 255 / 0.35), transparent 70%);
        mix-blend-mode: screen;
      }
      /* The bars are transparent: each divider canvas paints bar + waves in one pass (see mountBubbleBorder). */
      .r-bar { position: relative; z-index: 1; flex: none; height: 2.9rem; box-sizing: border-box; background: none; }
      .r-name { margin: 0; font: 24px/1.3 'Press Start 2P', monospace; letter-spacing: 0.05em; overflow-wrap: anywhere; text-shadow: var(--text-glow); }
      .r-bio {
        margin: 0; font: 24px/1.2 'VT323', monospace; letter-spacing: 0.03em; color: #4A3288;
      }

      /* The 404 is standalone and must include the Main tab layout styles. */
      .pixel-divider {
        --pd-h: 88px;
        position: relative;
        flex: none;
        height: var(--pd-h);
        pointer-events: none;
      }
      .pixel-divider > canvas {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        image-rendering: pixelated;
      }
      .pixel-divider-bottom { transform: scaleY(-1); }

      .r-center {
        display: flex;
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 2.25rem;
        padding: 0 2.5rem;
        text-align: left;
        overflow: hidden;
      }
      .r-avatar {
        display: block;
        width: 144px;
        height: 144px;
        margin: 8px;
        flex: none;
        object-fit: cover;
        border-radius: 50%;
        image-rendering: auto;
        background: transparent;
        box-shadow: 0 0 0 2px rgb(255 255 255 / 0.85), 0 0 18px 4px rgb(var(--glow) / 0.8), 0 0 48px 12px rgb(var(--amethyst) / 0.45);
        animation: halo-breathe 6s ease-in-out infinite;
      }
      @keyframes halo-breathe {
        0%, 100% { box-shadow: 0 0 0 2px rgb(255 255 255 / 0.85), 0 0 18px 4px rgb(var(--glow) / 0.7), 0 0 44px 10px rgb(var(--amethyst) / 0.4); }
        50% { box-shadow: 0 0 0 2px rgb(255 255 255 / 1), 0 0 26px 8px rgb(var(--glow) / 0.95), 0 0 70px 20px rgb(var(--amethyst) / 0.55); }
      }
      .r-text {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        max-width: 28rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
      .r-hello {
        font: 10px/1.6 'Press Start 2P', monospace;
        letter-spacing: 0.08em;
        color: var(--lavender);
      }

      .stage-tabs { position: fixed; z-index: 6; display: flex; align-items: flex-end; pointer-events: none; opacity: 0; }
      .tabs { display: flex; align-items: flex-end; gap: 4px; width: 792px; padding-left: 4px; }
      .tab {
        height: 40px;
        display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0;
        padding: 8px 12px; background: var(--tab-bg); color: var(--tab-fg); box-shadow: var(--glow-line);
        font: 11px/1.4 'Press Start 2P', monospace; text-transform: uppercase; white-space: nowrap;
      }
      .tab svg { width: 24px; height: 24px; flex: none; fill: currentColor; stroke: currentColor; stroke-linejoin: round; stroke-linecap: round; shape-rendering: geometricPrecision; }
      .tab.active { background: var(--status-pink); color: var(--wine); text-shadow: none; transform: translateY(4px); filter: drop-shadow(0 0 10px rgb(var(--glow) / 0.9)); }
      .tabs .spacer { flex: 1; }
      .tabs .sound { padding: 8px 12px; }
      /* ---------- Vertical (3:4) stage: mirrors the portrait rules at the end of src/views/main.css ---------- */
      .replica[data-mode='portrait'] .r-bar { height: 28px; }
      .replica[data-mode='portrait'] .pixel-divider { --pd-h: 56px; }
      .replica[data-mode='portrait'] .r-center { flex-direction: column; align-items: center; gap: 1rem; padding: 0 1.5rem; text-align: center; }
      .replica[data-mode='portrait'] .r-avatar { width: 104px; height: 104px; margin: 8px; }
      .replica[data-mode='portrait'] .r-text { flex: 0 1 auto; width: 100%; max-width: 22rem; align-items: center; gap: 0.5rem; text-align: center; }
      .replica[data-mode='portrait'] .r-hello { font-size: 12px; }
      .replica[data-mode='portrait'] .r-name { font-size: 28px; text-align: center; }
      .replica[data-mode='portrait'] .r-bio { font-size: 22px; line-height: 1.15; text-align: center; }
      /* Tab row: all four labels always visible; 412px wide (the 420px stage minus its 8px shadow room). */
      .stage-tabs.portrait .tabs { width: 412px; padding-left: 0; gap: 4px; }
      .stage-tabs.portrait .tab { padding: 8px 5px; gap: 4px; font-size: 8px; line-height: 1.375; }
      .stage-tabs.portrait .tab.sound { padding: 8px; }
      .surge { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; background: rgb(var(--glow)); mix-blend-mode: screen; }
      .scan-wipe {
        position: fixed; left: 0; right: 0; z-index: 8; height: 14vh; pointer-events: none; opacity: 0;
        background: linear-gradient(to bottom, transparent, rgba(255,255,255,.28), transparent);
      }

      @media (max-width: 600px) {
        html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
        body {
          height: 100vh; height: 100dvh; min-height: 0;
          padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
          overflow: hidden;
        }
        .error-window { display: flex; width: min(100%, 480px); max-height: 100%; }
        .error-screen {
          width: 100%; min-height: 0;
          height: min(340px, calc(100dvh - max(12px, env(safe-area-inset-top)) - max(12px, env(safe-area-inset-bottom)) - 24px));
          gap: clamp(16px, 3dvh, 28px); padding: clamp(16px, 3.5dvh, 32px) 12px;
        }
        h1 { gap: clamp(10px, 2dvh, 16px); }
        .error-code { font-size: clamp(48px, 15vw, 72px); }
        .error-label { font-size: clamp(9px, 2.6vw, 11px); }
        .go-home { min-height: 44px; padding: 12px 18px; font-size: 8px; }
      }
      @media (max-width: 420px) {
        .error-screen { padding-inline: 8px; }
        .error-code { font-size: clamp(46px, 15vw, 64px); }
      }
      @media (max-height: 420px) and (max-width: 900px) {
        .error-screen { gap: 12px; padding-block: 12px; }
        h1 { gap: 8px; }
        .error-code { font-size: clamp(40px, 12vh, 54px); }
        .error-label { font-size: 8px; }
        .go-home { min-height: 38px; padding-block: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>
    <main class="error-window" id="win">
      <section class="error-screen" id="screen" aria-labelledby="error-title">
        <h1 id="error-title" aria-label="404 Not Found">
          <span class="error-code" id="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></span>
          <span class="error-label" id="label" aria-hidden="true">NOT FOUND</span>
        </h1>
        <a class="go-home" id="go" href="https://novoumy.com/">GO BACK</a>
      </section>
    </main>
    <div class="surge" id="surge" aria-hidden="true"></div>
    <div class="scan-wipe" id="wipe" aria-hidden="true"></div>

    <script>
      (function () {
        'use strict';

        /* ====================================================================
           Tiny 8-bit synth (same voice as the main site's UI sounds).
           Honors the volume the visitor chose on the main site (novoumy:volume).
           ==================================================================== */
        var ctx = null;
        var noiseBuf = null;

        function level() {
          try {
            var raw = localStorage.getItem('novoumy:volume');
            var n = raw === null ? 100 : Number(raw);
            if (!isFinite(n)) n = 100;
            return Math.min(200, Math.max(0, n)) / 200;
          } catch (_) { return 0.5; }
        }
        function audio() {
          if (level() <= 0) return null;
          try {
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
          } catch (_) { return null; }
          return ctx;
        }
        function running() { return !!ctx && ctx.state === 'running'; }

        function tone(freq, o) {
          var c = audio(); if (!c) return;
          o = o || {};
          var at = o.at || 0, dur = o.dur || 0.1, vol = (o.vol == null ? 0.12 : o.vol) * level();
          var t = c.currentTime + at;
          var osc = c.createOscillator(), g = c.createGain();
          osc.type = o.type || 'square';
          osc.frequency.setValueAtTime(freq, t);
          if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), t + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(g); g.connect(c.destination);
          osc.start(t); osc.stop(t + dur + 0.02);
        }
        function noise(o) {
          var c = audio(); if (!c) return;
          o = o || {};
          var at = o.at || 0, dur = o.dur || 0.03, vol = (o.vol == null ? 0.08 : o.vol) * level();
          if (!noiseBuf) {
            noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 0.25), c.sampleRate);
            var d = noiseBuf.getChannelData(0);
            for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          }
          var t = c.currentTime + at;
          var src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
          src.buffer = noiseBuf;
          f.type = 'bandpass'; f.frequency.value = o.freq || 3000; f.Q.value = 1.2;
          g.gain.setValueAtTime(Math.max(0.0001, vol), t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(f); f.connect(g); g.connect(c.destination);
          src.start(t); src.stop(t + dur + 0.02);
        }

        var sfx = {
          // arrives on the 404: static crackle, two falling "wrong" buzzes
          error: function () {
            noise({ dur: 0.14, vol: 0.09, freq: 1600 });
            tone(240, { dur: 0.2, to: 110, vol: 0.1 });
            tone(190, { at: 0.17, dur: 0.26, to: 80, vol: 0.1 });
            tone(70, { at: 0.3, dur: 0.22, type: 'sawtooth', vol: 0.05 });
            noise({ at: 0.42, dur: 0.05, vol: 0.04, freq: 900 });
          },
          hover: function () { tone(880, { dur: 0.03, vol: 0.05 }); },
          press: function () { tone(330, { dur: 0.05, vol: 0.12 }); tone(660, { at: 0.04, dur: 0.07, vol: 0.1 }); noise({ dur: 0.02, vol: 0.05, freq: 4000 }); },
          glitch: function () { noise({ dur: 0.06, vol: 0.05, freq: 5000 }); tone(1200, { dur: 0.04, to: 300, vol: 0.04 }); },
          roll: function (i) { tone(260 + i * 18 + Math.random() * 60, { dur: 0.02, vol: 0.045 }); },
          lock: function (i) {
            var f = [523, 659, 784][i] || 784;
            tone(f, { dur: 0.12, type: 'triangle', vol: 0.16 });
            tone(f * 2, { at: 0.03, dur: 0.08, vol: 0.05 });
            noise({ dur: 0.03, vol: 0.05, freq: 5200 });
          },
          surge: function () {
            noise({ dur: 0.24, vol: 0.09, freq: 5200 });
            tone(60, { dur: 0.3, to: 1500, type: 'sawtooth', vol: 0.07 });
          },
          morph: function () {
            tone(140, { dur: 0.85, to: 900, type: 'sine', vol: 0.12 });
            tone(55, { dur: 0.85, to: 130, type: 'sawtooth', vol: 0.05 });
            [523, 659, 784, 1047, 1319].forEach(function (f, i) {
              tone(f, { at: 0.12 + i * 0.14, dur: 0.09, type: 'triangle', vol: 0.08 });
            });
            noise({ at: 0.78, dur: 0.07, vol: 0.05, freq: 6000 });
          },
          tab: function (i) {
            var base = 523 * Math.pow(2, (i * 3) / 12);
            noise({ dur: 0.02, vol: 0.05, freq: 4000 });
            tone(base, { dur: 0.05, vol: 0.1 });
            tone(base * 1.5, { at: 0.045, dur: 0.09, vol: 0.1 });
          },
          key: function () { noise({ dur: 0.012, vol: 0.03, freq: 4200 }); },
          boot: function () {
            [523, 659, 784, 1047].forEach(function (f, i) { tone(f, { at: i * 0.05, dur: 0.1, type: 'triangle', vol: 0.15 }); });
            tone(2093, { at: 0.2, dur: 0.12, vol: 0.05 });
            noise({ dur: 0.05, vol: 0.04, freq: 6000 });
          }
        };

        /* ====================================================================
           Helpers

            [{ transform: 'translateY(-14vh)', opacity: 0.9 }, { transform: 'translateY(105vh)', opacity: 0.9 }],
            { duration: 700, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
          screen.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(7px)' }, { transform: 'translateX(0)' }], { duration: 220, easing: 'steps(4)' });
          await done(surgeAnim);

          // 3) the error window becomes the main window
          var t = target();
          var r = win.getBoundingClientRect();
          win.style.position = 'fixed';
          win.style.left = r.left + 'px'; win.style.top = r.top + 'px';
          win.style.width = r.width + 'px'; win.style.height = r.height + 'px';
          win.style.margin = '0'; win.style.maxHeight = 'none'; win.style.zIndex = '5';
          win.style.maxWidth = 'none';
          win.style.overflow = 'hidden';

          var replica = buildReplica(t);
          win.appendChild(replica);
          replica.querySelectorAll('.pixel-divider').forEach(function (d) {
            mountBubbleBorder(d.querySelector('canvas'), d.classList.contains('pixel-divider-bottom') ? 'bottom' : 'top');
          });
          var tabs = buildTabs(t);
          document.body.appendChild(tabs);

          var s = t.zoom;
          var k0 = Math.max(0.35, Math.min(1, r.width / t.w));
          // luminous window glow, scaled with the stage (same layers as --window-glow)
          var glow = function (m) {
            return '0 0 0 ' + m + 'px rgb(255 255 255 / 0.7), 0 0 ' + (24 * m) + 'px ' + (4 * m) + 'px rgb(196 170 255 / 0.55), 0 0 ' + (90 * m) + 'px ' + (20 * m) + 'px rgb(124 84 220 / 0.35), inset 0 0 ' + (30 * m) + 'px rgb(255 255 255 / 0.4)';
          };
          var EASE = 'cubic-bezier(.76,0,.24,1)', DUR = 820;
          sfx.morph();

          var winAnim = win.animate([
            { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', boxShadow: glow(1) },
            { left: t.left + 'px', top: t.top + 'px', width: t.w + 'px', height: t.h + 'px', boxShadow: glow(s) }
          ], { duration: DUR, easing: EASE, fill: 'forwards' });
          var screenAnim = screen.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
          var repShow = replica.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 380, delay: DUR * 0.35, easing: 'ease-out', fill: 'forwards' });
          var repScale = replica.animate([{ transform: 'scale(' + k0 + ')' }, { transform: 'scale(1)' }], { duration: DUR, easing: EASE, fill: 'forwards' });
          screen.style.position = 'absolute'; screen.style.inset = '0'; // leave flow so it can't push the window's size
          screen.style.minHeight = '0';
          await Promise.all([done(winAnim), done(screenAnim), done(repShow), done(repScale), done(wipeAnim)]);

          // commit the final state, drop the animation fills
          win.style.left = t.left + 'px'; win.style.top = t.top + 'px';
          win.style.width = t.w + 'px'; win.style.height = t.h + 'px';
          win.style.boxShadow = glow(s);
          replica.style.opacity = '1'; replica.style.transform = 'none';
          screen.style.display = 'none';
          [winAnim, repShow, repScale, screenAnim, wipeAnim].forEach(function (a) { a.cancel(); });
          wipe.style.display = 'none';

          // 4) tabs drop in, one blip each
          tabs.style.opacity = '1';
          var items = tabs.querySelectorAll('.tab');
          var anims = [];
          for (var i = 0; i < items.length; i++) {
            (function (el, idx) {
              var rest = el.classList.contains('active') ? 'translateY(4px)' : 'none';
              setTimeout(function () { sfx.tab(Math.min(idx, 4)); }, idx * 85);
              anims.push(done(el.animate(
                [{ opacity: 0, transform: 'translateY(-28px)' }, { opacity: 1, transform: rest }],
                { duration: 300, delay: idx * 85, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' })));
            })(items[i], i);
          }
          await Promise.all(anims);

          // 5) the profile pops in (live clock keeps ticking), then hand over to the real page
          sfx.boot();
          var parts = replica.querySelectorAll('.r-center > *');
          var pops = [];
          for (var j = 0; j < parts.length; j++) {
            pops.push(done(parts[j].animate(
              [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }],
              { duration: 320, delay: j * 90, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' })));
          }
          await Promise.all(pops);
          await sleep(450);
          // tell the app this window is already on screen so it doesn't fade it in a second time
          try { sessionStorage.setItem('novoumy:from404', '1'); } catch (_) {}

          window.location.assign(href);
        }

        go.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return; // let "open in new tab" work
          if (started) { e.preventDefault(); return; }
          if (reduce) return;
          e.preventDefault();
          run('/#main').catch(function () { window.location.assign('/#main'); });
        });
      })();
    </script>
  </body>
</html>
