<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#847FA4" />
    <script>
      // The static 404 page shares the same saved theme preference as the app.
      (function () {
        try {
          var mode = localStorage.getItem('novoumy-theme');
          if (mode === 'dark') mode = 'invert';
          if (mode === 'theme') document.documentElement.classList.add('theme-soft');
          else if (mode === 'invert') document.documentElement.classList.add('theme-dark');
          document.documentElement.style.colorScheme = mode === 'theme' || mode === 'invert' ? 'dark' : 'light';
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.content = mode === 'theme' ? '#0d0b0f' : mode === 'invert' ? '#2B253A' : '#847FA4';
        } catch (_) {
          // Keep the default light retro 404 if storage is unavailable.
        }
      })();
    </script>
    <title>404 Not Found — novoumy</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --paper: #ECEFF1;
        --lavender: #847FA4;
        --wine: #6B2D39;
        --rose: #CD9EBA;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        color: var(--wine);
        background-color: var(--lavender);
        background-image:
          linear-gradient(to right, rgba(236,239,241,.12) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(236,239,241,.12) 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: 'VT323', monospace;
      }
      .error-window {
        position: relative;
        width: min(100%, 680px);
        padding: 8px;
        background: var(--paper);
        border: 4px solid var(--wine);
        box-shadow: 7px 7px 0 var(--wine);
      }
      .error-screen {
        position: relative;
        display: flex;
        min-height: 340px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        overflow: hidden;
        padding: 48px 18px;
        border-top: 3px solid var(--rose);
        border-bottom: 3px solid var(--rose);
        text-align: center;
        isolation: isolate;
      }
      .error-screen::before {
        position: absolute;
        z-index: -1;
        inset: 0;
        background: repeating-linear-gradient(to bottom, rgba(107,45,57,.035) 0 1px, transparent 1px 4px);
        content: '';
      }
      h1 {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: 0;
        color: var(--wine);
      }
      .error-code {
        display: block;
        font: clamp(58px, 15vw, 112px)/1 'Press Start 2P', monospace;
        letter-spacing: -0.08em;
        padding-right: .08em;
        text-shadow: 5px 5px 0 var(--rose), 10px 10px 0 rgba(107,45,57,.16);
      }
      .error-label {
        display: block;
        font: clamp(11px, 2.5vw, 16px)/1.5 'Press Start 2P', monospace;
        letter-spacing: .08em;
      }
      .go-home {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border: 3px solid var(--wine);
        background: var(--wine);
        box-shadow: 5px 5px 0 var(--rose), 8px 8px 0 var(--wine);
        color: var(--paper);
        font: 9px/1.5 'Press Start 2P', monospace;
        text-decoration: none;
        transition: transform 100ms steps(2), box-shadow 100ms steps(2), background 100ms steps(2), color 100ms steps(2);
      }
      .go-home:hover, .go-home:focus-visible {
        outline: 2px dashed var(--wine);
        outline-offset: 5px;
        background: var(--rose);
        color: var(--wine);
      }
      .go-home:active {
        transform: translate(5px, 5px);
        box-shadow: none;
      }
      @media (max-width: 600px) {
        html, body {
          width: 100%;
          height: 100%;
          overflow: hidden;
          overscroll-behavior: none;
        }
        body {
          height: 100vh;
          height: 100dvh;
          min-height: 0;
          padding: max(12px, env(safe-area-inset-top))
                   max(12px, env(safe-area-inset-right))
                   max(12px, env(safe-area-inset-bottom))
                   max(12px, env(safe-area-inset-left));
          overflow: hidden;
        }
        .error-window {
          display: flex;
          width: min(100%, 480px);
          max-height: 100%;
        }
        .error-screen {
          width: 100%;
          min-height: 0;
          height: min(340px, calc(100dvh - max(12px, env(safe-area-inset-top)) - max(12px, env(safe-area-inset-bottom)) - 24px));
          gap: clamp(16px, 3dvh, 28px);
          padding: clamp(16px, 3.5dvh, 32px) 12px;
        }
        h1 { gap: clamp(10px, 2dvh, 16px); }
        .error-code { font-size: clamp(48px, 15vw, 72px); }
        .error-label { font-size: clamp(9px, 2.6vw, 11px); }
        .go-home { min-height: 44px; padding: 12px 18px; font-size: 8px; }
      }
      @media (max-width: 420px) {
        .error-screen { padding-inline: 8px; }
        .error-code { font-size: clamp(46px, 15vw, 64px); }
      }
      @media (max-height: 420px) and (max-width: 900px) {
        .error-screen { gap: 12px; padding-block: 12px; }
        h1 { gap: 8px; }
        .error-code { font-size: clamp(40px, 12vh, 54px); }
        .error-label { font-size: 8px; }
        .go-home { min-height: 38px; padding-block: 8px; }
      }

      /* Saved /theme palette: same plum-charcoal surfaces as Novoumy OS. */
      html.theme-soft {
        color-scheme: dark;
        --paper: #1a161b;
        --lavender: #0d0b0f;
        --wine: #e6ded1;
        --rose: #9d75b2;
        --edge: #3f353d;
        --grid: rgb(63 53 61 / 0.18);
        --scanline: rgb(230 222 209 / 0.025);
        --button-bg: #29232e;
        --button-fg: #e6ded1;
        --button-edge: #3f353d;
        --button-shadow: #3f353d;
      }
      html.theme-soft body {
        color: var(--wine);
        background-color: var(--lavender);
        background-image:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      }
      html.theme-soft .error-window {
        background: var(--paper);
        border-color: var(--edge);
        box-shadow: 7px 7px 0 var(--edge);
      }
      html.theme-soft .error-screen {
        border-top-color: #554650;
        border-bottom-color: #554650;
      }
      html.theme-soft .error-screen::before {
        background: repeating-linear-gradient(to bottom, var(--scanline) 0 1px, transparent 1px 4px);
      }
      html.theme-soft h1 { color: #e6ded1; }
      html.theme-soft .error-code {
        text-shadow: 4px 4px 0 #765d83, 8px 8px 0 rgb(13 11 15 / 0.45);
      }
      html.theme-soft .go-home {
        background: var(--button-bg);
        border-color: var(--button-edge);
        box-shadow: 5px 5px 0 #765d83, 8px 8px 0 var(--button-shadow);
        color: var(--button-fg);
      }
      html.theme-soft .go-home:hover,
      html.theme-soft .go-home:focus-visible {
        outline-color: #c7809d;
        background: #342738;
        color: #f4eedb;
      }

      /* Saved /invert palette: preserve the original inverted option on the 404 too. */
      html.theme-dark {
        color-scheme: dark;
        --paper: #191622;
        --lavender: #2B253A;
        --wine: #F1EAF5;
        --rose: #8F76AD;
        --edge: #574967;
        --grid: rgb(183 169 201 / 0.10);
        --scanline: rgb(183 169 201 / 0.035);
        --button-bg: #8F76AD;
        --button-fg: #191622;
        --button-edge: #8F76AD;
        --button-shadow: #191622;
      }
      html.theme-dark body {
        color: var(--wine);
        background-color: var(--lavender);
        background-image:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      }
      html.theme-dark .error-window {
        background: var(--paper);
        border-color: var(--rose);
        box-shadow: 7px 7px 0 var(--paper);
      }
      html.theme-dark .error-screen {
        border-top-color: var(--rose);
        border-bottom-color: var(--rose);
      }
      html.theme-dark .error-screen::before {
        background: repeating-linear-gradient(to bottom, var(--scanline) 0 1px, transparent 1px 4px);
      }
      html.theme-dark h1 { color: var(--wine); }
      html.theme-dark .error-code {
        text-shadow: 5px 5px 0 var(--rose), 10px 10px 0 rgb(0 0 0 / 0.22);
      }
      html.theme-dark .go-home {
        background: var(--button-bg);
        border-color: var(--button-edge);
        box-shadow: 5px 5px 0 var(--rose), 8px 8px 0 var(--button-shadow);
        color: var(--button-fg);
      }
      html.theme-dark .go-home:hover,
      html.theme-dark .go-home:focus-visible {
        outline-color: var(--rose);
        background: #B7A9C9;
        color: #191622;
      }
    </style>
  </head>
  <body>
    <main class="error-window">
      <section class="error-screen" aria-labelledby="error-title">
        <h1 id="error-title" aria-label="404 Not Found">
          <span class="error-code" aria-hidden="true">404</span>
          <span class="error-label">NOT FOUND</span>
        </h1>
        <a class="go-home" href="https://novoumy.com/">GO BACK</a>
      </section>
    </main>
  </body>
</html>
