name: Sync Steam Games

on:
  schedule:
    # Run every 12 hours at 30 minutes past the hour (UTC)
    - cron: '30 */12 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write

jobs:
  sync-steam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Python and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install requests

      - name: Install npm dependencies
        run: npm install

      - name: Run Steam sync script
        env:
          STEAM_ID: ${{ secrets.STEAM_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          python3 scripts/sync-steam.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if data files were modified
          if git status --porcelain | grep -q '.'; then
            # Add data files
            git add public/data/steam-games.json
            
            # Create commit message
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore: sync steam games data [skip ci]"
            
            # Push to repository
            git push
          else
            echo "No changes to sync, skipping commit."
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf node_modules/.cache
          rm -rf ~/.cache/pip
